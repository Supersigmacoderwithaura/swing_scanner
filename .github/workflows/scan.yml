name: Swing Scan

on:
  schedule:
    - cron: "30 21 * * 1-5"   # weekdays 21:30 UTC = after the US market closes
  workflow_dispatch:           # lets you press "Run workflow" by hand

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - run: pip install yfinance pandas

      - name: Run scanner
        run: |
          for i in 1 2 3; do
            python swing_scanner.py --no-open --account 10000 --risk 1 && break
            echo "Attempt $i failed, retrying in 60 seconds"
            sleep 60
          done
          mkdir -p site
          cp swing_scan.html site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
